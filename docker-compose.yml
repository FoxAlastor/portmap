services:
  backend:
    build: ./backend
    container_name: portmap-api
    ports:
      - "5000:5000"
    restart: unless-stopped
    # Needs host network access for port scanning
    network_mode: host

  frontend:
    build: ./frontend
    container_name: portmap-ui
    ports:
      - "8787:80"
    restart: unless-stopped
    depends_on:
      - backend
