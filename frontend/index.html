<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PortMap — сканер портів</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg:       #0d0f14;
    --surface:  #13161e;
    --surface2: #1a1e28;
    --border:   #252a38;
    --text:     #c8d0e0;
    --muted:    #5a6380;
    --open:     #22c55e;
    --open-dim: #16391f;
    --closed:   #ef4444;
    --closed-dim:#3a1212;
    --accent:   #6366f1;
    --accent2:  #818cf8;
    --yellow:   #f59e0b;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* ── Layout ── */
  .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
  }
  .logo { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; color: var(--accent2); letter-spacing: -0.5px; }
  .logo span { color: var(--open); }
  header p { font-size: .78rem; color: var(--muted); margin-left: auto; }

  .workspace { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 57px); overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-section { padding: 20px; border-bottom: 1px solid var(--border); }
  .sidebar-section:last-child { border-bottom: none; flex: 1; }
  .section-label { font-size: .65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }

  /* Hosts list */
  .hosts-list { display: flex; flex-direction: column; gap: 6px; }
  .host-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; transition: all .15s;
    font-family: var(--mono); font-size: .8rem;
  }
  .host-item:hover { background: var(--surface2); border-color: var(--border); }
  .host-item.active { background: var(--surface2); border-color: var(--accent); }
  .host-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .3s; }
  .host-dot.alive { background: var(--open); box-shadow: 0 0 6px var(--open); }
  .host-dot.dead { background: var(--closed); }
  .host-dot.checking { background: var(--yellow); animation: pulse 1s infinite; }
  .host-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host-open-count { font-size: .7rem; color: var(--open); font-weight: 600; }
  .host-remove { opacity: 0; font-size: 1rem; color: var(--muted); transition: opacity .15s; cursor: pointer; padding: 0 2px; }
  .host-item:hover .host-remove { opacity: 1; }

  .add-host { display: flex; gap: 8px; margin-top: 10px; }
  .add-host input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px; border-radius: 6px;
    font-family: var(--mono); font-size: .8rem; outline: none;
    transition: border-color .15s;
  }
  .add-host input:focus { border-color: var(--accent); }
  .add-host input::placeholder { color: var(--muted); }

  /* Scan options */
  .option-group { margin-bottom: 14px; }
  .option-group label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 6px; }
  .radio-group { display: flex; flex-direction: column; gap: 5px; }
  .radio-group label {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: .8rem; color: var(--text); font-family: var(--mono);
  }
  input[type=radio] { accent-color: var(--accent); cursor: pointer; }
  .range-inputs { display: flex; gap: 6px; margin-top: 8px; }
  .range-inputs input, .custom-ports-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 8px; border-radius: 5px;
    font-family: var(--mono); font-size: .78rem; outline: none;
  }
  .custom-ports-input { width: 100%; margin-top: 8px; }
  .range-inputs input:focus, .custom-ports-input:focus { border-color: var(--accent); }
  .range-inputs input::placeholder, .custom-ports-input::placeholder { color: var(--muted); }
  .hidden { display: none !important; }

  .btn {
    padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
    font-family: var(--mono); font-size: .8rem; font-weight: 600;
    transition: all .15s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { background: var(--muted); cursor: not-allowed; }
  .btn-sm { padding: 5px 10px; font-size: .75rem; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent2); }

  /* ── Main panel ── */
  .main { display: flex; flex-direction: column; overflow: hidden; }

  .main-toolbar {
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--surface);
  }
  .host-title { font-family: var(--mono); font-size: .95rem; font-weight: 600; color: var(--accent2); }
  .scan-stats { display: flex; gap: 16px; margin-left: auto; }
  .stat { text-align: right; }
  .stat-val { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; }
  .stat-val.green { color: var(--open); }
  .stat-val.red { color: var(--closed); }
  .stat-label { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* Filter bar */
  .filter-bar {
    padding: 10px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: var(--bg);
  }
  .filter-bar input {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 6px 12px; border-radius: 5px;
    font-family: var(--mono); font-size: .8rem; outline: none; width: 200px;
  }
  .filter-bar input:focus { border-color: var(--accent); }
  .filter-tabs { display: flex; gap: 4px; }
  .filter-tab {
    padding: 5px 12px; border-radius: 5px; font-size: .75rem; cursor: pointer;
    font-family: var(--mono); font-weight: 600; border: 1px solid transparent;
    transition: all .15s; color: var(--muted);
  }
  .filter-tab.active { background: var(--surface2); border-color: var(--border); color: var(--text); }
  .filter-tab.tab-open.active { border-color: var(--open-dim); color: var(--open); background: var(--open-dim); }
  .filter-tab.tab-closed.active { border-color: var(--closed-dim); color: var(--closed); background: var(--closed-dim); }

  /* Port grid */
  .port-area { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .port-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }

  .port-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; display: flex;
    align-items: center; gap: 12px; transition: all .15s; cursor: default;
  }
  .port-card.open { border-color: var(--open-dim); background: #0d1a12; }
  .port-card.open:hover { border-color: var(--open); }
  .port-card.closed { opacity: .45; }
  .port-card.closed:hover { opacity: .7; }
  .port-num { font-family: var(--mono); font-weight: 700; font-size: .9rem; min-width: 44px; }
  .port-card.open .port-num { color: var(--open); }
  .port-card.closed .port-num { color: var(--muted); }
  .port-service { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .port-card.open .port-service { color: var(--text); }
  .port-badge { font-size: .6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0; }
  .badge-open { background: var(--open-dim); color: var(--open); }
  .badge-closed { background: var(--closed-dim); color: var(--closed); }

  /* Empty / loading states */
  .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: var(--muted); }
  .state-box .big-icon { font-size: 3rem; }
  .state-box p { font-size: .85rem; text-align: center; line-height: 1.6; }

  /* Progress bar */
  .progress-wrap { width: 100%; height: 3px; background: var(--border); position: relative; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  .progress-bar.scanning { animation: scanProgress 2s ease-in-out infinite; }

  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  @keyframes scanProgress {
    0% { width: 0%; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 0%; margin-left: 100%; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 8px; font-size: .82rem;
    font-family: var(--mono); animation: toastIn .2s ease;
    box-shadow: 0 8px 32px #0005;
  }
  @keyframes toastIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Port<span>Map</span></div>
    <p id="localInfo">завантаження…</p>
  </header>

  <div class="workspace">
    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-label">Хости</div>
        <div class="hosts-list" id="hostsList"></div>
        <div class="add-host" style="margin-top:10px;">
          <input type="text" id="newHostInput" placeholder="IP або hostname" />
          <button class="btn btn-primary btn-sm" onclick="addHost()">+</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Параметри сканування</div>

        <div class="option-group">
          <label>Діапазон портів</label>
          <div class="radio-group">
            <label><input type="radio" name="range" value="common" checked onchange="onRangeChange()"> Найпоширеніші (~60 портів)</label>
            <label><input type="radio" name="range" value="range" onchange="onRangeChange()"> Вказати діапазон</label>
            <label><input type="radio" name="range" value="custom" onchange="onRangeChange()"> Свої порти</label>
          </div>
          <div class="range-inputs hidden" id="rangeInputs">
            <input type="number" id="portStart" placeholder="від" value="1" min="1" max="65535">
            <input type="number" id="portEnd" placeholder="до" value="1024" min="1" max="65535">
          </div>
          <input type="text" class="custom-ports-input hidden" id="customPorts" placeholder="80, 443, 3000, 8080…">
        </div>

        <div class="option-group">
          <label>Таймаут з'єднання</label>
          <div class="radio-group">
            <label><input type="radio" name="timeout" value="0.3"> Швидко (0.3с)</label>
            <label><input type="radio" name="timeout" value="0.5" checked> Стандарт (0.5с)</label>
            <label><input type="radio" name="timeout" value="1.5"> Повільно (1.5с)</label>
          </div>
        </div>

        <button class="btn btn-primary" style="width:100%;margin-top:4px;" id="scanBtn" onclick="scanSelected()">
          🔍 Сканувати
        </button>
      </div>
    </aside>

    <!-- ── Main ── -->
    <div class="main">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

      <div class="main-toolbar" id="toolbar">
        <div>
          <div class="host-title" id="toolbarHost">Оберіть хост зліва</div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:2px;" id="toolbarIp"></div>
        </div>
        <div class="scan-stats" id="scanStats" style="display:none;">
          <div class="stat"><div class="stat-val green" id="statOpen">-</div><div class="stat-label">Відкрито</div></div>
          <div class="stat"><div class="stat-val red" id="statClosed">-</div><div class="stat-label">Закрито</div></div>
          <div class="stat"><div class="stat-val" id="statTime">-</div><div class="stat-label">Секунд</div></div>
        </div>
      </div>

      <div class="filter-bar" id="filterBar" style="display:none;">
        <input type="text" id="searchInput" placeholder="Пошук порту чи сервісу…" oninput="renderPorts()">
        <div class="filter-tabs">
          <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">Всі</div>
          <div class="filter-tab tab-open" data-filter="open" onclick="setFilter('open')">Відкриті</div>
          <div class="filter-tab tab-closed" data-filter="closed" onclick="setFilter('closed')">Закриті</div>
        </div>
      </div>

      <div class="port-area" id="portArea">
        <div class="state-box">
          <div class="big-icon">🗺️</div>
          <p>Додайте хости зліва та натисніть <strong>«Сканувати»</strong><br>щоб побачити карту портів.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:5000'
  : `http://${window.location.hostname}:5000`;

let hosts = JSON.parse(localStorage.getItem('pm_hosts') || '[]');
let selectedHost = null;
let currentFilter = 'all';
let lastResults = {};
let scanning = false;

// ── Init ──
(async () => {
  try {
    const r = await fetch(`${API}/api/local`);
    const d = await r.json();
    document.getElementById('localInfo').textContent = `${d.hostname} · ${d.local_ip}`;
    if (!hosts.find(h => h.name === 'localhost')) {
      hosts.unshift({ name: 'localhost', ip: d.local_ip });
      saveHosts();
    }
  } catch(e) {
    document.getElementById('localInfo').textContent = 'localhost';
    if (!hosts.find(h => h.name === 'localhost')) {
      hosts.unshift({ name: 'localhost' });
      saveHosts();
    }
  }
  renderHostsList();
  if (hosts.length) selectHost(hosts[0].name);
})();

// ── Hosts management ──
function saveHosts() { localStorage.setItem('pm_hosts', JSON.stringify(hosts)); }

function addHost() {
  const input = document.getElementById('newHostInput');
  const name = input.value.trim();
  if (!name) return;
  if (hosts.find(h => h.name === name)) { showToast('Хост вже є у списку'); return; }
  hosts.push({ name });
  saveHosts();
  renderHostsList();
  input.value = '';
  selectHost(name);
}

function removeHost(name) {
  hosts = hosts.filter(h => h.name !== name);
  delete lastResults[name];
  saveHosts();
  renderHostsList();
  if (selectedHost === name) {
    selectedHost = null;
    document.getElementById('toolbarHost').textContent = 'Оберіть хост зліва';
    document.getElementById('toolbarIp').textContent = '';
    document.getElementById('scanStats').style.display = 'none';
    document.getElementById('filterBar').style.display = 'none';
    document.getElementById('portArea').innerHTML = `<div class="state-box"><div class="big-icon">🗺️</div><p>Додайте хости зліва та натисніть <strong>«Сканувати»</strong><br>щоб побачити карту портів.</p></div>`;
  }
}

function renderHostsList() {
  const list = document.getElementById('hostsList');
  list.innerHTML = '';
  hosts.forEach(h => {
    const r = lastResults[h.name];
    const openCount = r ? r.open : null;
    const alive = r ? r.alive : null;
    const dotClass = alive === null ? '' : alive ? 'alive' : 'dead';

    const el = document.createElement('div');
    el.className = `host-item${selectedHost === h.name ? ' active' : ''}`;
    el.innerHTML = `
      <div class="host-dot ${dotClass}" id="dot_${CSS.escape(h.name)}"></div>
      <span class="host-name">${h.name}</span>
      ${openCount !== null ? `<span class="host-open-count">${openCount} open</span>` : ''}
      <span class="host-remove" onclick="event.stopPropagation();removeHost('${h.name.replace(/'/g,"\\'")}')">✕</span>
    `;
    el.onclick = () => selectHost(h.name);
    list.appendChild(el);
  });
}

function selectHost(name) {
  selectedHost = name;
  renderHostsList();
  const h = hosts.find(h => h.name === name);
  document.getElementById('toolbarHost').textContent = name;
  document.getElementById('toolbarIp').textContent = h?.ip ? `IP: ${h.ip}` : '';

  if (lastResults[name]) {
    showResults(lastResults[name]);
  } else {
    document.getElementById('scanStats').style.display = 'none';
    document.getElementById('filterBar').style.display = 'none';
    document.getElementById('portArea').innerHTML = `<div class="state-box"><div class="big-icon">⏳</div><p>Ще не сканували. Натисніть <strong>«Сканувати»</strong>.</p></div>`;
  }
}

// ── Scan ──
async function scanSelected() {
  if (!selectedHost) { showToast('Оберіть хост'); return; }
  if (scanning) return;
  scanning = true;

  const rangeVal = document.querySelector('input[name=range]:checked').value;
  const timeout = document.querySelector('input[name=timeout]:checked').value;
  const body = { host: selectedHost, range: rangeVal, timeout: parseFloat(timeout) };

  if (rangeVal === 'range') {
    body.start = parseInt(document.getElementById('portStart').value) || 1;
    body.end = parseInt(document.getElementById('portEnd').value) || 1024;
  }
  if (rangeVal === 'custom') {
    const raw = document.getElementById('customPorts').value;
    body.ports = raw.split(/[\s,;]+/).filter(Boolean);
    if (!body.ports.length) { showToast('Введіть хоча б один порт'); scanning = false; return; }
  }

  const btn = document.getElementById('scanBtn');
  btn.disabled = true; btn.textContent = '⏳ Сканую…';
  const bar = document.getElementById('progressBar');
  bar.className = 'progress-bar scanning';

  document.getElementById('portArea').innerHTML = `<div class="state-box"><div class="big-icon">📡</div><p>Сканую <strong>${selectedHost}</strong>…<br><span style="font-size:.75rem;color:var(--muted);">паралельне підключення до ${body.range === 'range' ? body.end - body.start + 1 : 'портів'}</span></p></div>`;

  try {
    const res = await fetch(`${API}/api/scan`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Помилка'); }
    const data = await res.json();

    // Update host ip
    const h = hosts.find(h => h.name === selectedHost);
    if (h) { h.ip = data.ip; saveHosts(); }

    lastResults[selectedHost] = data;
    showResults(data);
    renderHostsList();
    showToast(`✅ Готово за ${data.elapsed}с — ${data.open} відкрито`);
  } catch(e) {
    document.getElementById('portArea').innerHTML = `<div class="state-box"><div class="big-icon">❌</div><p>${e.message}</p></div>`;
    showToast('❌ ' + e.message);
  } finally {
    scanning = false;
    btn.disabled = false; btn.textContent = '🔍 Сканувати';
    bar.className = 'progress-bar';
    bar.style.width = '100%';
    setTimeout(() => { bar.style.width = '0%'; }, 600);
  }
}

function showResults(data) {
  document.getElementById('statOpen').textContent = data.open;
  document.getElementById('statClosed').textContent = data.closed;
  document.getElementById('statTime').textContent = data.elapsed + 's';
  document.getElementById('scanStats').style.display = 'flex';
  document.getElementById('filterBar').style.display = 'flex';
  document.getElementById('toolbarIp').textContent = `IP: ${data.ip} · ${data.alive ? '🟢 онлайн' : '🔴 офлайн'}`;
  renderPorts();
}

// ── Filter & render ──
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  renderPorts();
}

function renderPorts() {
  const data = lastResults[selectedHost];
  if (!data) return;
  const search = (document.getElementById('searchInput').value || '').toLowerCase();

  let ports = data.results.filter(p => {
    if (currentFilter === 'open' && p.status !== 'open') return false;
    if (currentFilter === 'closed' && p.status !== 'closed') return false;
    if (search && !String(p.port).includes(search) && !p.service.toLowerCase().includes(search)) return false;
    return true;
  });

  // Sort: open first, then by port
  ports.sort((a, b) => {
    if (a.status === b.status) return a.port - b.port;
    return a.status === 'open' ? -1 : 1;
  });

  if (!ports.length) {
    document.getElementById('portArea').innerHTML = `<div class="state-box"><div class="big-icon">🔍</div><p>Нічого не знайдено</p></div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'port-grid';
  ports.forEach(p => {
    const card = document.createElement('div');
    card.className = `port-card ${p.status}`;
    card.innerHTML = `
      <div class="port-num">${p.port}</div>
      <div class="port-service">${p.service}</div>
      <div class="port-badge ${p.status === 'open' ? 'badge-open' : 'badge-closed'}">${p.status === 'open' ? 'open' : 'closed'}</div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('portArea').innerHTML = '';
  document.getElementById('portArea').appendChild(grid);
}

// ── Helpers ──
function onRangeChange() {
  const v = document.querySelector('input[name=range]:checked').value;
  document.getElementById('rangeInputs').classList.toggle('hidden', v !== 'range');
  document.getElementById('customPorts').classList.toggle('hidden', v !== 'custom');
}

document.getElementById('newHostInput').addEventListener('keydown', e => { if (e.key === 'Enter') addHost(); });

let toastTimer;
function showToast(msg) {
  let t = document.querySelector('.toast');
  if (t) t.remove();
  clearTimeout(toastTimer);
  t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 3500);
}
</script>
</body>
